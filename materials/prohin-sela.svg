<g transform=\"translate(502.89453125, 4595.6015625)\" data-id=\"P3\" data-node=\"true\" id=\"flowchart-P3-150\" class=\"node default t flowchart-label\"><rect height=\"32\" width=\"536.0006408691406\" y=\"-16\" x=\"-268.0003204345703\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-251.15234375, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"521\" x=\"-9.347976684570312\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Кожна правка факту з рядком «що змінилося» для читача, датованим днем викладу</span></div></foreignObject></g></g><g transform=\"translate(1325.453125, 4595.6015625)\" data-id=\"O1\" data-node=\"true\" id=\"flowchart-O1-142\" class=\"node default t flowchart-label\"><rect height=\"32\" width=\"166.0001220703125\" y=\"-16\" x=\"-83.00006103515625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-70.76171875, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"151\" x=\"-4.73834228515625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Читає PR і каже «мерж»</span></div></foreignObject></g></g><g transform=\"translate(1305.453125, 4687.1015625)\" data-id=\"O2\" data-node=\"true\" id=\"flowchart-O2-143\" class=\"node default t flowchart-label\"><rect height=\"49\" width=\"420.00048828125\" y=\"-24.5\" x=\"-210.000244140625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-192.75390625, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"405\" x=\"-9.746337890625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">У день релізу: сторінки відкриваються, запис у стрічку оновлень,<br />село в черзі стає «вийшло», «деплой»</span></div></foreignObject></g></g><g transform=\"translate(1082.19921875, 4770.1015625)\" data-id=\"O3\" data-node=\"true\" id=\"flowchart-O3-144\" class=\"node default h flowchart-label\"><rect height=\"49\" width=\"531.0006713867188\" y=\"-24.5\" x=\"-265.5003356933594\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-247.15234375, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"516\" x=\"-10.847991943359375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Сторінка на сайті: кожне твердження з виноскою, розділи «Чого ми ще не знаємо»,<br />«Як ми це шукали», «Як посилатися»</span></div></foreignObject></g></g><g transform=\"translate(1325.453125, 3981.9140625)\" data-id=\"H1\" data-node=\"true\" id=\"flowchart-H1-127\" class=\"node default t flowchart-label\"><rect height=\"49\" width=\"327.0003662109375\" y=\"-24.5\" x=\"-163.50018310546875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-150.37109375, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"312\" x=\"-5.62908935546875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">verify: усі перевірки разом; check-content --queue;<br />dzherela-check: чи існують URL, на які послалися</span></div></foreignObject></g></g><g transform=\"translate(1325.453125, 4064.9140625)\" data-id=\"H2\" data-node=\"true\" id=\"flowchart-H2-128\" class=\"node default t flowchart-label\"><rect height=\"49\" width=\"507.0006103515625\" y=\"-24.5\" x=\"-253.50030517578125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-234.109375, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"492\" x=\"-11.89093017578125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Облік прогону: розклад агентів з транскриптів, читання кешу й вивід за сесією;<br />блокери рахуються зі звітів, не по памʼяті</span></div></foreignObject></g></g><g transform=\"translate(1325.453125, 4184.5078125)\" data-id=\"H3\" data-node=\"true\" id=\"flowchart-H3-129\" class=\"node default g flowchart-label\"><polygon style=\"\" transform=\"translate(-61.09375,61.09375)\" class=\"label-container\" points=\"61.09375,0 122.1875,-61.09375 61.09375,-122.1875 0,-61.09375\"/><g transform=\"translate(-37.59375, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"84\" x=\"-4.40631103515625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">гейт чистий?</span></div></foreignObject></g></g><g transform=\"translate(1325.453125, 4321.1015625)\" data-id=\"H4\" data-node=\"true\" id=\"flowchart-H4-130\" class=\"node default f flowchart-label\"><rect height=\"49\" width=\"433.00048828125\" y=\"-24.5\" x=\"-216.500244140625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-201.63671875, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"418\" x=\"-7.363525390625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Сторінки published; або draft з датою релізу в буденний день,<br />гейт прогнано наперед, у день релізу лишається сама заміна рядка</span></div></foreignObject></g></g><g transform=\"translate(1325.453125, 4429.6015625)\" data-id=\"H5\" data-node=\"true\" id=\"flowchart-H5-131\" class=\"node default f flowchart-label\"><rect height=\"32\" width=\"343.0003662109375\" y=\"-16\" x=\"-171.50018310546875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-157.5234375, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"328\" x=\"-6.47674560546875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Село в черзі стає «готове» з датою; календар релізів</span></div></foreignObject></g></g><g transform=\"translate(1325.453125, 4495.6015625)\" data-id=\"H6\" data-node=\"true\" id=\"flowchart-H6-132\" class=\"node default t flowchart-label\"><rect height=\"32\" width=\"504.0006103515625\" y=\"-16\" x=\"-252.00030517578125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-234.92578125, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"489\" x=\"-9.57452392578125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">PR на main із зеленим CI: збірка сайту, перевірка змін, перевірка дати викладу</span></div></foreignObject></g></g><g transform=\"translate(1325.453125, 3441.4140625)\" data-id=\"L1\" data-node=\"true\" id=\"flowchart-L1-115\" class=\"node default o flowchart-label\"><rect height=\"66\" width=\"455.0006103515625\" y=\"-33\" x=\"-227.50030517578125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-211.45703125, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"440\" x=\"-8.54327392578125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Перевіряльник логіки<br />несуперечність між сторінками села і з сусідами:<br />дати, числа, імена, звʼязки; бачить суперечність, якої ніхто не називав</span></div></foreignObject></g></g><g transform=\"translate(1325.453125, 3524.4140625)\" data-id=\"L2\" data-node=\"true\" id=\"flowchart-L2-116\" class=\"node default s flowchart-label\"><rect height=\"32\" width=\"416.00048828125\" y=\"-16\" x=\"-208.000244140625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-191.61328125, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"401\" x=\"-8.886962890625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Правник виконує таблицю логіки; що потребує автора, повертає</span></div></foreignObject></g></g><g transform=\"translate(1325.453125, 3607.4140625)\" data-id=\"L3\" data-node=\"true\" id=\"flowchart-L3-117\" class=\"node default s flowchart-label\"><rect height=\"66\" width=\"472.0006103515625\" y=\"-33\" x=\"-236.00030517578125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-218.83203125, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"457\" x=\"-9.66827392578125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Прохід стилю<br />мова після машинних перевірок: шаблонні звороти, театр, кухня проєкту,<br />довгі речення й канцелярит за звітом rytm; фактів не чіпає</span></div></foreignObject></g></g><g transform=\"translate(1325.453125, 3690.4140625)\" data-id=\"L3b\" data-node=\"true\" id=\"flowchart-L3b-118\" class=\"node default o flowchart-label\"><rect height=\"32\" width=\"381.0003662109375\" y=\"-16\" x=\"-190.50018310546875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-176.16015625, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"366\" x=\"-6.84002685546875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Прохід «чи не перевиправили»: факти на місці після стилю</span></div></foreignObject></g></g><g transform=\"translate(1325.453125, 3773.4140625)\" data-id=\"L4\" data-node=\"true\" id=\"flowchart-L4-119\" class=\"node default t flowchart-label\"><rect height=\"32\" width=\"593.0006103515625\" y=\"-16\" x=\"-296.50030517578125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-277.41015625, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"578\" x=\"-11.59014892578125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Скрипти: люди села з бази записів, кандидати в родини (не твердження), нотатки для читача</span></div></foreignObject></g></g><g transform=\"translate(1325.453125, 3856.4140625)\" data-id=\"L5\" data-node=\"true\" id=\"flowchart-L5-120\" class=\"node default s flowchart-label\"><rect height=\"66\" width=\"462.0006103515625\" y=\"-33\" x=\"-231.00030517578125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-214.04296875, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"447\" x=\"-9.45733642578125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Дозбір, друга хвиля<br />що звірка не змогла перевірити, і кожне «відкрите питання» сторінки:<br />названа й не відкрита справа це невиконана робота, прогін не здається</span></div></foreignObject></g></g><g transform=\"translate(2267.6875, 2266.6953125)\" data-id=\"W0\" data-node=\"true\" id=\"flowchart-W0-84\" class=\"node default t flowchart-label\"><rect height=\"66\" width=\"320.000244140625\" y=\"-33\" x=\"-160.0001220703125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-145.26953125, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"305\" x=\"-7.2305908203125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Зріз для сторінки: лише рядки реєстру з її ціллю,<br />суперечності, що її стосуються, картки джерел;<br />зведення цілком автор не бачить</span></div></foreignObject></g></g><g transform=\"translate(2267.6875, 2366.6953125)\" data-id=\"W1\" data-node=\"true\" id=\"flowchart-W1-85\" class=\"node default o flowchart-label\"><rect height=\"66\" width=\"584.000732421875\" y=\"-33\" x=\"-292.0003662109375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-273.96875, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"569\" x=\"-10.5316162109375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Автор<br />пише сторінку зі зрізу, виноска при кожному твердженні;<br />власної арифметики не веде, мовчання джерела без «перевірено, порожньо» не стверджує</span></div></foreignObject></g></g><g transform=\"translate(2267.6875, 2466.6953125)\" data-id=\"W2\" data-node=\"true\" id=\"flowchart-W2-86\" class=\"node default t flowchart-label\"><rect height=\"66\" width=\"450.00048828125\" y=\"-33\" x=\"-225.000244140625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-210.21484375, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"435\" x=\"-7.285400390625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Автор сам проганяє машину в тому самому заході:<br />partiia (числа проти партії), research-check --for (виноски поза зрізом),<br />check-content --as-published (канон сторінки, кухня, виноски)</span></div></foreignObject></g></g><g transform=\"translate(2267.6875, 2549.6953125)\" data-id=\"W3\" data-node=\"true\" id=\"flowchart-W3-87\" class=\"node default f flowchart-label\"><rect height=\"32\" width=\"399.00048828125\" y=\"-16\" x=\"-199.500244140625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-184.9140625, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"384\" x=\"-7.086181640625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Чернетка сторінки в content: село, подія, біографія або розбір</span></div></foreignObject></g></g><g transform=\"translate(2438.65234375, 2632.6953125)\" data-id=\"W4a\" data-node=\"true\" id=\"flowchart-W4a-88\" class=\"node default o flowchart-label\"><rect height=\"66\" width=\"357.000244140625\" y=\"-33\" x=\"-178.5001220703125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-162.83203125, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"342\" x=\"-8.1680908203125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Перевіряльник фактів на Opus<br />чистий контекст, не той, хто писав;<br />кожне твердження проти джерела за методом Claimify</span></div></foreignObject></g></g><g transform=\"translate(2027.27734375, 2632.6953125)\" data-id=\"W4b\" data-node=\"true\" id=\"flowchart-W4b-89\" class=\"node default s flowchart-label\"><rect height=\"66\" width=\"305.0003662109375\" y=\"-33\" x=\"-152.50018310546875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-137.03515625, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"290\" x=\"-7.96502685546875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Перевіряльник фактів на Sonnet<br />лише на сторінці села й біографіях:<br />розбіжність двох моделей це головний сигнал</span></div></foreignObject></g></g><g transform=\"translate(2438.65234375, 2732.6953125)\" data-id=\"W5\" data-node=\"true\" id=\"flowchart-W5-90\" class=\"node default f flowchart-label\"><rect height=\"66\" width=\"410.00048828125\" y=\"-33\" x=\"-205.000244140625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-188.4765625, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"395\" x=\"-9.023681640625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Звіти звірки: блокери, «джерело каже інше»,<br />«сказано менше, ніж дозволяє джерело», «не зміг перевірити»,<br />і таблиця «Правки» наприкінці</span></div></foreignObject></g></g><g transform=\"translate(2438.65234375, 2832.6953125)\" data-id=\"W6\" data-node=\"true\" id=\"flowchart-W6-91\" class=\"node default s flowchart-label\"><rect height=\"66\" width=\"575.000732421875\" y=\"-33\" x=\"-287.5003662109375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-268.61328125, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"560\" x=\"-11.3870849609375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Правник<br />виконує таблиці «Правки» механічно: зняти речення, замінити число, переклеїти виноску;<br />зведення і джерел не відкриває; до 5 сторінок за запуск, стеля 25 викликів</span></div></foreignObject></g></g><g transform=\"translate(2438.65234375, 2977.44140625)\" data-id=\"W7\" data-node=\"true\" id=\"flowchart-W7-92\" class=\"node default g flowchart-label\"><polygon style=\"\" transform=\"translate(-77.74609375,77.74609375)\" class=\"label-container\" points=\"77.74609375,0 155.4921875,-77.74609375 77.74609375,-155.4921875 0,-77.74609375\"/><g transform=\"translate(-54.24609375, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"117\" x=\"-4.2540283203125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">«потрібен автор»?</span></div></foreignObject></g></g><g transform=\"translate(1936.052734375, 3181.80078125)\" data-id=\"W8\" data-node=\"true\" id=\"flowchart-W8-93\" class=\"node default o flowchart-label\"><rect height=\"49\" width=\"254.0001220703125\" y=\"-24.5\" x=\"-127.00006103515625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-113.74609375, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"239\" x=\"-5.75396728515625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Автор повертається лише на ці рядки,<br />з тим самим зрізом, без звітів звірки</span></div></foreignObject></g></g><g transform=\"translate(2438.65234375, 3181.80078125)\" data-id=\"W9\" data-node=\"true\" id=\"flowchart-W9-94\" class=\"node default g flowchart-label\"><polygon style=\"\" transform=\"translate(-75.61328125,75.61328125)\" class=\"label-container\" points=\"75.61328125,0 151.2265625,-75.61328125 75.61328125,-151.2265625 0,-75.61328125\"/><g transform=\"translate(-52.11328125, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"113\" x=\"-4.3868408203125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">блокер лишився?</span></div></foreignObject></g></g><g transform=\"translate(2499.103515625, 4321.1015625)\" data-id=\"W10\" data-node=\"true\" id=\"flowchart-W10-95\" class=\"node default t flowchart-label\"><rect height=\"49\" width=\"236.000244140625\" y=\"-24.5\" x=\"-118.0001220703125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-103.59375, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"221\" x=\"-6.9063720703125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Сторінка лишається чернеткою,<br />блокери йдуть власникові списком</span></div></foreignObject></g></g><g transform=\"translate(2244.90234375, 3332.9140625)\" data-id=\"W11\" data-node=\"true\" id=\"flowchart-W11-96\" class=\"node default t flowchart-label\"><rect height=\"49\" width=\"367.000244140625\" y=\"-24.5\" x=\"-183.5001220703125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-167.58203125, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"352\" x=\"-8.4180908203125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">У фронтматер сторінки лягають шляхи всіх звітів звірки:<br />без двох звітів на селі й біографії гейт не пропускає</span></div></foreignObject></g></g><g transform=\"translate(2733.04296875, 1877.8203125)\" data-id=\"D1\" data-node=\"true\" id=\"flowchart-D1-74\" class=\"node default s flowchart-label\"><rect height=\"66\" width=\"643.0009765625\" y=\"-33\" x=\"-321.50048828125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-303.45703125, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"628\" x=\"-10.54345703125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Дозбір<br />по агенту на одну прогалину, яка блокує речення на запланованій сторінці:<br />том без тексту, число лише з переказу, нерозсуджена суперечність, адресована й не відкрита справа</span></div></foreignObject></g></g><g transform=\"translate(2733.04296875, 2022.2578125)\" data-id=\"D2\" data-node=\"true\" id=\"flowchart-D2-75\" class=\"node default g flowchart-label\"><polygon style=\"\" transform=\"translate(-60.4375,60.4375)\" class=\"label-container\" points=\"60.4375,0 120.875,-60.4375 60.4375,-120.875 0,-60.4375\"/><g transform=\"translate(-36.9375, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"81\" x=\"-3.5625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">що вийшло?</span></div></foreignObject></g></g><g transform=\"translate(2438.65234375, 2149.6953125)\" data-id=\"D3\" data-node=\"true\" id=\"flowchart-D3-76\" class=\"node default f flowchart-label\"><rect height=\"32\" width=\"221.000244140625\" y=\"-16\" x=\"-110.5001220703125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-97.1953125, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"206\" x=\"-5.8048095703125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Новий рядок у реєстрі з цитатою</span></div></foreignObject></g></g><g transform=\"translate(2792.4375, 2149.6953125)\" data-id=\"D4\" data-node=\"true\" id=\"flowchart-D4-77\" class=\"node default f flowchart-label\"><rect height=\"32\" width=\"467.00048828125\" y=\"-16\" x=\"-233.500244140625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-215.58984375, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"452\" x=\"-10.410400390625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Перелік незакритого: канальний дозбір закриє по багатьох селах одразу</span></div></foreignObject></g></g><g transform=\"translate(1058.162109375, 1288.7578125)\" data-id=\"Z1\" data-node=\"true\" id=\"flowchart-Z1-57\" class=\"node default s flowchart-label\"><rect height=\"66\" width=\"490.00054931640625\" y=\"-33\" x=\"-245.00027465820312\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-229.72265625, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"475\" x=\"-7.777618408203125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Зведення<br />збирає звіти в реєстр доказів: id, теза, джерела, бачено, цитата, статус, ціль;<br />суперечності не згладжує, факт без цитати стає «непевне»</span></div></foreignObject></g></g><g transform=\"translate(1841.43359375, 1380.2578125)\" data-id=\"Z2\" data-node=\"true\" id=\"flowchart-Z2-58\" class=\"node default f flowchart-label\"><rect height=\"49\" width=\"449.0003662109375\" y=\"-24.5\" x=\"-224.50018310546875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-208.14453125, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"434\" x=\"-8.85565185546875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Зведення села: паспорт, реєстр доказів, суперечності й ототожнення,<br />перевірено порожньо, відкриті запити, сирі звіти</span></div></foreignObject></g></g><g transform=\"translate(1841.43359375, 1471.7578125)\" data-id=\"Z3a\" data-node=\"true\" id=\"flowchart-Z3a-59\" class=\"node default t flowchart-label\"><rect height=\"66\" width=\"579.000732421875\" y=\"-33\" x=\"-289.5003662109375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-272.4609375, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"564\" x=\"-9.5394287109375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">research-check: кожен «факт» має цитату, кожна ціль веде на сторінку, id не повторюються<br />tsytata perevirka: цитати проти корпусу, обриви й переказ замість дослівного<br />research-check --syri: чи всі сирі звіти використано</span></div></foreignObject></g></g><g transform=\"translate(1841.43359375, 1607.7890625)\" data-id=\"Z3\" data-node=\"true\" id=\"flowchart-Z3-60\" class=\"node default g flowchart-label\"><polygon style=\"\" transform=\"translate(-69.03125,69.03125)\" class=\"label-container\" points=\"69.03125,0 138.0625,-69.03125 69.03125,-138.0625 0,-69.03125\"/><g transform=\"translate(-45.53125, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"99\" x=\"-3.96881103515625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">реєстр чистий?</span></div></foreignObject></g></g><g transform=\"translate(861.927734375, 1760.8203125)\" data-id=\"Z4\" data-node=\"true\" id=\"flowchart-Z4-61\" class=\"node default t flowchart-label\"><rect height=\"32\" width=\"346.0003662109375\" y=\"-16\" x=\"-173.00018310546875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-159, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"331\" x=\"-6.50018310546875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Ні: зведення переробляється, автор зрізу не отримує</span></div></foreignObject></g></g><g transform=\"translate(1881.4296875, 1760.8203125)\" data-id=\"Z5\" data-node=\"true\" id=\"flowchart-Z5-62\" class=\"node default t flowchart-label\"><rect height=\"66\" width=\"416.0006103515625\" y=\"-33\" x=\"-208.00030517578125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-192.46875, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"401\" x=\"-8.03155517578125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Оркестратор вирішує:<br />які сторінки будуть (село, події, біографії), що піде лише рядком,<br />чого не буде, і чи є в матеріалі сюжет для розбору</span></div></foreignObject></g></g><g transform=\"translate(1674.5859375, 1877.8203125)\" data-id=\"Z6\" data-node=\"true\" id=\"flowchart-Z6-63\" class=\"node default f flowchart-label\"><rect height=\"49\" width=\"307.0003662109375\" y=\"-24.5\" x=\"-153.50018310546875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-137.78125, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"292\" x=\"-8.21893310546875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Сюжет для розбору → черга розборів,<br />окремий скіл пише його зі звіреного матеріалу</span></div></foreignObject></g></g><g transform=\"translate(2863.68359375, 814.2578125)\" data-id=\"R1\" data-node=\"true\" id=\"flowchart-R1-22\" class=\"node default s flowchart-label\"><rect height=\"49\" width=\"428.00048828125\" y=\"-24.5\" x=\"-214.000244140625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-198.24609375, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"413\" x=\"-8.254150390625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Розвідник<br />архівні описи: ЦДІАК, ДАКО, описи фондів, справи за назвою села</span></div></foreignObject></g></g><g transform=\"translate(2447.90234375, 814.2578125)\" data-id=\"R2\" data-node=\"true\" id=\"flowchart-R2-23\" class=\"node default s flowchart-label\"><rect height=\"49\" width=\"386.000244140625\" y=\"-24.5\" x=\"-193.0001220703125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-176.53515625, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"371\" x=\"-8.9649658203125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Розвідник<br />омоніми й сучасне: скільки сіл із такою назвою, котре наше</span></div></foreignObject></g></g><g transform=\"translate(2003.51171875, 814.2578125)\" data-id=\"R3\" data-node=\"true\" id=\"flowchart-R3-24\" class=\"node default s flowchart-label\"><rect height=\"49\" width=\"483.00048828125\" y=\"-24.5\" x=\"-241