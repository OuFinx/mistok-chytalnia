slate(-159.15625, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"318.3125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Правка читача з форми «Правка» або нове джерело</span></div></foreignObject></g></g><g transform=\"translate(514.275390625, 4509.4140625)\" data-id=\"P2\" data-node=\"true\" id=\"flowchart-P2-149\" class=\"node default s flowchart-label\"><rect height=\"32\" width=\"497.28125\" y=\"-16\" x=\"-248.640625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-241.140625, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"482.28125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Дозбір: борги по опублікованих сторінках, канальний прохід по багатьох селах</span></div></foreignObject></g></g><g transform=\"translate(514.275390625, 4609.4140625)\" data-id=\"P3\" data-node=\"true\" id=\"flowchart-P3-150\" class=\"node default t flowchart-label\"><rect height=\"32\" width=\"529.625\" y=\"-16\" x=\"-264.8125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-257.3125, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"514.625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Кожна правка факту з рядком «що змінилося» для читача, датованим днем викладу</span></div></foreignObject></g></g><g transform=\"translate(1357.388671875, 4609.4140625)\" data-id=\"O1\" data-node=\"true\" id=\"flowchart-O1-142\" class=\"node default t flowchart-label\"><rect height=\"32\" width=\"160.109375\" y=\"-16\" x=\"-80.0546875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-72.5546875, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"145.109375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Читає PR і каже «мерж»</span></div></foreignObject></g></g><g transform=\"translate(1337.388671875, 4700.9140625)\" data-id=\"O2\" data-node=\"true\" id=\"flowchart-O2-143\" class=\"node default t flowchart-label\"><rect height=\"49\" width=\"413.7265625\" y=\"-24.5\" x=\"-206.86328125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-199.36328125, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"398.7265625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">У день релізу: сторінки відкриваються, запис у стрічку оновлень,<br />село в черзі стає «вийшло», «деплой»</span></div></foreignObject></g></g><g transform=\"translate(1107.525390625, 4783.9140625)\" data-id=\"O3\" data-node=\"true\" id=\"flowchart-O3-144\" class=\"node default h flowchart-label\"><rect height=\"49\" width=\"524.875\" y=\"-24.5\" x=\"-262.4375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-254.9375, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"509.875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Сторінка на сайті: кожне твердження з виноскою, розділи «Чого ми ще не знаємо»,<br />«Як ми це шукали», «Як посилатися»</span></div></foreignObject></g></g><g transform=\"translate(1357.388671875, 3992.6640625)\" data-id=\"H1\" data-node=\"true\" id=\"flowchart-H1-127\" class=\"node default t flowchart-label\"><rect height=\"49\" width=\"320.5\" y=\"-24.5\" x=\"-160.25\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-152.75, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"305.5\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">verify: усі перевірки разом; check-content --queue;<br />dzherela-check: чи існують URL, на які послалися</span></div></foreignObject></g></g><g transform=\"translate(1357.388671875, 4075.6640625)\" data-id=\"H2\" data-node=\"true\" id=\"flowchart-H2-128\" class=\"node default t flowchart-label\"><rect height=\"49\" width=\"500.5546875\" y=\"-24.5\" x=\"-250.27734375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-242.77734375, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"485.5546875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Облік прогону: розклад агентів з транскриптів, читання кешу й вивід за сесією;<br />блокери рахуються зі звітів, не по памʼяті</span></div></foreignObject></g></g><g transform=\"translate(1357.388671875, 4196.7890625)\" data-id=\"H3\" data-node=\"true\" id=\"flowchart-H3-129\" class=\"node default g flowchart-label\"><polygon style=\"\" transform=\"translate(-62.625,62.625)\" class=\"label-container\" points=\"62.625,0 125.25,-62.625 62.625,-125.25 0,-62.625\"/><g transform=\"translate(-39.125, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"78.25\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">гейт чистий?</span></div></foreignObject></g></g><g transform=\"translate(1357.388671875, 4334.9140625)\" data-id=\"H4\" data-node=\"true\" id=\"flowchart-H4-130\" class=\"node default f flowchart-label\"><rect height=\"49\" width=\"426.6875\" y=\"-24.5\" x=\"-213.34375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-205.84375, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"411.6875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Сторінки published; або draft з датою релізу в буденний день,<br />гейт прогнано наперед, у день релізу лишається сама заміна рядка</span></div></foreignObject></g></g><g transform=\"translate(1357.388671875, 4443.4140625)\" data-id=\"H5\" data-node=\"true\" id=\"flowchart-H5-131\" class=\"node default f flowchart-label\"><rect height=\"32\" width=\"336.6015625\" y=\"-16\" x=\"-168.30078125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-160.80078125, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"321.6015625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Село в черзі стає «готове» з датою; календар релізів</span></div></foreignObject></g></g><g transform=\"translate(1357.388671875, 4509.4140625)\" data-id=\"H6\" data-node=\"true\" id=\"flowchart-H6-132\" class=\"node default t flowchart-label\"><rect height=\"32\" width=\"498.40625\" y=\"-16\" x=\"-249.203125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-241.703125, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"483.40625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">PR на main із зеленим CI: збірка сайту, перевірка змін, перевірка дати викладу</span></div></foreignObject></g></g><g transform=\"translate(1357.388671875, 3452.1640625)\" data-id=\"L1\" data-node=\"true\" id=\"flowchart-L1-115\" class=\"node default o flowchart-label\"><rect height=\"66\" width=\"449.4609375\" y=\"-33\" x=\"-224.73046875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-217.23046875, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"434.4609375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Перевіряльник логіки<br />несуперечність між сторінками села і з сусідами:<br />дати, числа, імена, звʼязки; бачить суперечність, якої ніхто не називав</span></div></foreignObject></g></g><g transform=\"translate(1357.388671875, 3535.1640625)\" data-id=\"L2\" data-node=\"true\" id=\"flowchart-L2-116\" class=\"node default s flowchart-label\"><rect height=\"32\" width=\"409.6875\" y=\"-16\" x=\"-204.84375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-197.34375, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"394.6875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Правник виконує таблицю логіки; що потребує автора, повертає</span></div></foreignObject></g></g><g transform=\"translate(1357.388671875, 3618.1640625)\" data-id=\"L3\" data-node=\"true\" id=\"flowchart-L3-117\" class=\"node default s flowchart-label\"><rect height=\"66\" width=\"465.625\" y=\"-33\" x=\"-232.8125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-225.3125, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"450.625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Прохід стилю<br />мова після машинних перевірок: шаблонні звороти, театр, кухня проєкту,<br />довгі речення й канцелярит за звітом rytm; фактів не чіпає</span></div></foreignObject></g></g><g transform=\"translate(1357.388671875, 3701.1640625)\" data-id=\"L3b\" data-node=\"true\" id=\"flowchart-L3b-118\" class=\"node default o flowchart-label\"><rect height=\"32\" width=\"374.859375\" y=\"-16\" x=\"-187.4296875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-179.9296875, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"359.859375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Прохід «чи не перевиправили»: факти на місці після стилю</span></div></foreignObject></g></g><g transform=\"translate(1357.388671875, 3784.1640625)\" data-id=\"L4\" data-node=\"true\" id=\"flowchart-L4-119\" class=\"node default t flowchart-label\"><rect height=\"32\" width=\"586.9140625\" y=\"-16\" x=\"-293.45703125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-285.95703125, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"571.9140625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Скрипти: люди села з бази записів, кандидати в родини (не твердження), нотатки для читача</span></div></foreignObject></g></g><g transform=\"translate(1357.388671875, 3867.1640625)\" data-id=\"L5\" data-node=\"true\" id=\"flowchart-L5-120\" class=\"node default s flowchart-label\"><rect height=\"66\" width=\"455.5703125\" y=\"-33\" x=\"-227.78515625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-220.28515625, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"440.5703125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Дозбір, друга хвиля<br />що звірка не змогла перевірити, і кожне «відкрите питання» сторінки:<br />названа й не відкрита справа це невиконана робота, прогін не здається</span></div></foreignObject></g></g><g transform=\"translate(2326.87109375, 2272.5703125)\" data-id=\"W0\" data-node=\"true\" id=\"flowchart-W0-84\" class=\"node default t flowchart-label\"><rect height=\"66\" width=\"313.5625\" y=\"-33\" x=\"-156.78125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-149.28125, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"298.5625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Зріз для сторінки: лише рядки реєстру з її ціллю,<br />суперечності, що її стосуються, картки джерел;<br />зведення цілком автор не бачить</span></div></foreignObject></g></g><g transform=\"translate(2326.87109375, 2372.5703125)\" data-id=\"W1\" data-node=\"true\" id=\"flowchart-W1-85\" class=\"node default o flowchart-label\"><rect height=\"66\" width=\"577.6796875\" y=\"-33\" x=\"-288.83984375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-281.33984375, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"562.6796875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Автор<br />пише сторінку зі зрізу, виноска при кожному твердженні;<br />власної арифметики не веде, мовчання джерела без «перевірено, порожньо» не стверджує</span></div></foreignObject></g></g><g transform=\"translate(2326.87109375, 2472.5703125)\" data-id=\"W2\" data-node=\"true\" id=\"flowchart-W2-86\" class=\"node default t flowchart-label\"><rect height=\"66\" width=\"443.8984375\" y=\"-33\" x=\"-221.94921875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-214.44921875, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"428.8984375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Автор сам проганяє машину в тому самому заході:<br />partiia (числа проти партії), research-check --for (виноски поза зрізом),<br />check-content --as-published (канон сторінки, кухня, виноски)</span></div></foreignObject></g></g><g transform=\"translate(2326.87109375, 2555.5703125)\" data-id=\"W3\" data-node=\"true\" id=\"flowchart-W3-87\" class=\"node default f flowchart-label\"><rect height=\"32\" width=\"393.0546875\" y=\"-16\" x=\"-196.52734375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-189.02734375, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"378.0546875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Чернетка сторінки в content: село, подія, біографія або розбір</span></div></foreignObject></g></g><g transform=\"translate(2505.623046875, 2638.5703125)\" data-id=\"W4a\" data-node=\"true\" id=\"flowchart-W4a-88\" class=\"node default o flowchart-label\"><rect height=\"66\" width=\"350.6875\" y=\"-33\" x=\"-175.34375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-167.84375, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"335.6875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Перевіряльник фактів на Opus<br />чистий контекст, не той, хто писав;<br />кожне твердження проти джерела за методом Claimify</span></div></foreignObject></g></g><g transform=\"translate(2076.90234375, 2638.5703125)\" data-id=\"W4b\" data-node=\"true\" id=\"flowchart-W4b-89\" class=\"node default s flowchart-label\"><rect height=\"66\" width=\"298.8984375\" y=\"-33\" x=\"-149.44921875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-141.94921875, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"283.8984375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Перевіряльник фактів на Sonnet<br />лише на сторінці села й біографіях:<br />розбіжність двох моделей це головний сигнал</span></div></foreignObject></g></g><g transform=\"translate(2505.623046875, 2738.5703125)\" data-id=\"W5\" data-node=\"true\" id=\"flowchart-W5-90\" class=\"node default f flowchart-label\"><rect height=\"66\" width=\"403.6875\" y=\"-33\" x=\"-201.84375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-194.34375, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"388.6875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Звіти звірки: блокери, «джерело каже інше»,<br />«сказано менше, ніж дозволяє джерело», «не зміг перевірити»,<br />і таблиця «Правки» наприкінці</span></div></foreignObject></g></g><g transform=\"translate(2505.623046875, 2838.5703125)\" data-id=\"W6\" data-node=\"true\" id=\"flowchart-W6-91\" class=\"node default s flowchart-label\"><rect height=\"66\" width=\"568.90625\" y=\"-33\" x=\"-284.453125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-276.953125, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"553.90625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Правник<br />виконує таблиці «Правки» механічно: зняти речення, замінити число, переклеїти виноску;<br />зведення і джерел не відкриває; до 5 сторінок за запуск, стеля 25 викликів</span></div></foreignObject></g></g><g transform=\"translate(2505.623046875, 2984.58984375)\" data-id=\"W7\" data-node=\"true\" id=\"flowchart-W7-92\" class=\"node default g flowchart-label\"><polygon style=\"\" transform=\"translate(-79.01953125,79.01953125)\" class=\"label-container\" points=\"79.01953125,0 158.0390625,-79.01953125 79.01953125,-158.0390625 0,-79.01953125\"/><g transform=\"translate(-55.51953125, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"111.0390625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">«потрібен автор»?</span></div></foreignObject></g></g><g transform=\"translate(1984.93359375, 3191.38671875)\" data-id=\"W8\" data-node=\"true\" id=\"flowchart-W8-93\" class=\"node default o flowchart-label\"><rect height=\"49\" width=\"247.640625\" y=\"-24.5\" x=\"-123.8203125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-116.3203125, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"232.640625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Автор повертається лише на ці рядки,<br />з тим самим зрізом, без звітів звірки</span></div></foreignObject></g></g><g transform=\"translate(2505.623046875, 3191.38671875)\" data-id=\"W9\" data-node=\"true\" id=\"flowchart-W9-94\" class=\"node default g flowchart-label\"><polygon style=\"\" transform=\"translate(-76.77734375,76.77734375)\" class=\"label-container\" points=\"76.77734375,0 153.5546875,-76.77734375 76.77734375,-153.5546875 0,-76.77734375\"/><g transform=\"translate(-53.27734375, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"106.5546875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">блокер лишився?</span></div></foreignObject></g></g><g transform=\"translate(2562.8515625, 4334.9140625)\" data-id=\"W10\" data-node=\"true\" id=\"flowchart-W10-95\" class=\"node default t flowchart-label\"><rect height=\"49\" width=\"229.65625\" y=\"-24.5\" x=\"-114.828125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-107.328125, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"214.65625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Сторінка лишається чернеткою,<br />блокери йдуть власникові списком</span></div></foreignObject></g></g><g transform=\"translate(2301.23046875, 3343.6640625)\" data-id=\"W11\" data-node=\"true\" id=\"flowchart-W11-96\" class=\"node default t flowchart-label\"><rect height=\"49\" width=\"360.9453125\" y=\"-24.5\" x=\"-180.47265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-172.97265625, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"345.9453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">У фронтматер сторінки лягають шляхи всіх звітів звірки:<br />без двох звітів на селі й біографії гейт не пропускає</span></div></foreignObject></g></g><g transform=\"translate(2803.775390625, 1882.75)\" data-id=\"D1\" data-node=\"true\" id=\"flowchart-D1-74\" class=\"node default s flowchart-label\"><rect height=\"66\" width=\"637.453125\" y=\"-33\" x=\"-318.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-311.2265625, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"622.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Дозбір<br />по агенту на одну прогалину, яка блокує речення на запланованій сторінці:<br />том без тексту, число лише з переказу, нерозсуджена суперечність, адресована й не відкрита справа</span></div></foreignObject></g></g><g transform=\"translate(2803.775390625, 2027.66015625)\" data-id=\"D2\" data-node=\"true\" id=\"flowchart-D2-75\" class=\"node default g flowchart-label\"><polygon style=\"\" transform=\"translate(-60.91015625,60.91015625)\" class=\"label-container\" points=\"60.91015625,0 121.8203125,-60.91015625 60.91015625,-121.8203125 0,-60.91015625\"/><g transform=\"translate(-37.41015625, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"74.8203125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">що вийшло?</span></div></foreignObject></g></g><g transform=\"translate(2505.623046875, 2155.5703125)\" data-id=\"D3\" data-node=\"true\" id=\"flowchart-D3-76\" class=\"node default f flowchart-label\"><rect height=\"32\" width=\"215.3203125\" y=\"-16\" x=\"-107.66015625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-100.16015625, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"200.3203125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Новий рядок у реєстрі з цитатою</span></div></foreignObject></g></g><g transform=\"translate(2869.642578125, 2155.5703125)\" data-id=\"D4\" data-node=\"true\" id=\"flowchart-D4-77\" class=\"node default f flowchart-label\"><rect height=\"32\" width=\"460.71875\" y=\"-16\" x=\"-230.359375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-222.859375, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"445.71875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Перелік незакритого: канальний дозбір закриє по багатьох селах одразу</span></div></foreignObject></g></g><g transform=\"translate(1092.0390625, 1291.3046875)\" data-id=\"Z1\" data-node=\"true\" id=\"flowchart-Z1-57\" class=\"node default s flowchart-label\"><rect height=\"66\" width=\"484.40625\" y=\"-33\" x=\"-242.203125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-234.703125, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"469.40625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Зведення<br />збирає звіти в реєстр доказів: id, теза, джерела, бачено, цитата, статус, ціль;<br />суперечності не згладжує, факт без цитати стає «непевне»</span></div></foreignObject></g></g><g transform=\"translate(1890.828125, 1382.8046875)\" data-id=\"Z2\" data-node=\"true\" id=\"flowchart-Z2-58\" class=\"node default f flowchart-label\"><rect height=\"49\" width=\"442.78125\" y=\"-24.5\" x=\"-221.390625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-213.890625, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"427.78125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Зведення села: паспорт, реєстр доказів, суперечності й ототожнення,<br />перевірено порожньо, відкриті запити, сирі звіти</span></div></foreignObject></g></g><g transform=\"translate(1890.828125, 1474.3046875)\" data-id=\"Z3a\" data-node=\"true\" id=\"flowchart-Z3a-59\" class=\"node default t flowchart-label\"><rect height=\"66\" width=\"572.9921875\" y=\"-33\" x=\"-286.49609375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-278.99609375, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"557.9921875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">research-check: кожен «факт» має цитату, кожна ціль веде на сторінку, id не повторюються<br />tsytata perevirka: цитати проти корпусу, обриви й переказ замість дослівного<br />research-check --syri: чи всі сирі звіти використано</span></div></foreignObject></g></g><g transform=\"translate(1890.828125, 1611.52734375)\" data-id=\"Z3\" data-node=\"true\" id=\"flowchart-Z3-60\" class=\"node default g flowchart-label\"><polygon style=\"\" transform=\"translate(-70.22265625,70.22265625)\" class=\"label-container\" points=\"70.22265625,0 140.4453125,-70.22265625 70.22265625,-140.4453125 0,-70.22265625\"/><g transform=\"translate(-46.72265625, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"93.4453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">реєстр чистий?</span></div></foreignObject></g></g><g transform=\"translate(891.478515625, 1765.75)\" data-id=\"Z4\" data-node=\"true\" id=\"flowchart-Z4-61\" class=\"node default t flowchart-label\"><rect height=\"32\" width=\"340.1171875\" y=\"-16\" x=\"-170.05859375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-162.55859375, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"325.1171875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Ні: зведення переробляється, автор зрізу не отримує</span></div></foreignObject></g></g><g transform=\"translate(1931.544921875, 1765.75)\" data-id=\"Z5\" data-node=\"true\" id=\"flowchart-Z5-62\" class=\"node default t flowchart-label\"><rect height=\"66\" width=\"410.125\" y=\"-33\" x=\"-205.0625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-197.5625, -25.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"51\" width=\"395.125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Оркестратор вирішує:<br />які сторінки будуть (село, події, біографії), що піде лише рядком,<br />чого не буде, і чи є в матеріалі сюжет для розбору</span></div></foreignObject></g></g><g transform=\"translate(1721.1953125, 1882.75)\" data-id=\"Z6\" data-node=\"true\" id=\"flowchart-Z6-63\" class=\"node default f flowchart-label\"><rect height=\"49\" width=\"300.9609375\" y=\"-24.5\" x=\"-150.48046875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-142.98046875, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"285.9609375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Сюжет для розбору → черга розборів,<br />окремий скіл пише його зі звіреного матеріалу</span></div></foreignObject></g></g><g transform=\"translate(2940.4296875, 816.8046875)\" data-id=\"R1\" data-node=\"true\" id=\"flowchart-R1-22\" class=\"node default s flowchart-label\"><rect height=\"49\" width=\"422.265625\" y=\"-24.5\" x=\"-211.1328125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-203.6328125, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"407.265625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Розвідник<br />архівні описи: ЦДІАК, ДАКО, описи фондів, справи за назвою села</span></div></foreignObject></g></g><g transform=\"translate(2513.3984375, 816.8046875)\" data-id=\"R2\" data-node=\"true\" id=\"flowchart-R2-23\" class=\"node default s flowchart-label\"><rect height=\"49\" width=\"379.796875\" y=\"-24.5\" x=\"-189.8984375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-182.3984375, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"364.796875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Розвідник<br />омоніми й сучасне: скільки сіл із такою назвою, котре наше</span></div></foreignObject></g></g><g transform=\"translate(2058.94921875, 816.8046875)\" data-id=\"R3\" data-node=\"true\" id=\"flowchart-R3-24\" class=\"node default s flowchart-label\"><rect height=\"49\" width=\"477.1015625\" y=\"-24.5\" x=\"-238.55078125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-231.05078125, -17)\" style=\"\" class=\"label\"><rect/><foreignObject hei