block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">PR на main із зеленим CI</span></div></foreignObject></g></g><g transform=\"translate(962.14453125, 3429.921875)\" data-id=\"H9\" data-node=\"true\" id=\"flowchart-H9-131\" class=\"node default h flowchart-label\"><rect height=\"32\" width=\"579.0006713867188\" y=\"-16\" x=\"-289.5003356933594\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-273.40625, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"564\" x=\"-8.594085693359375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Власник: «мерж», «деплой»; дата в «що змінилося» це день викладу, і деплой це перевіряє</span></div></foreignObject></g></g><g transform=\"translate(962.14453125, 3495.921875)\" data-id=\"H10\" data-node=\"true\" id=\"flowchart-H10-132\" class=\"node default f flowchart-label\"><rect height=\"32\" width=\"530.0006103515625\" y=\"-16\" x=\"-265.00030517578125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-247.73828125, -8.5)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"17\" width=\"515\" x=\"-9.76202392578125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Що не закрилося, вертається в журнал боргу і чекає наступного проходу по каналу</span></div></foreignObject></g></g><g transform=\"translate(624.8671875, 2357.1953125)\" data-id=\"V0\" data-node=\"true\" id=\"flowchart-V0-109\" class=\"node default t flowchart-label\"><rect height=\"49\" width=\"428.0005187988281\" y=\"-24.5\" x=\"-214.00025939941406\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-199.1640625, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"413\" x=\"-7.3361968994140625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Агенти внесення діляться по селах: один звіт торкається сімох сіл,<br />одне село фігурує в пʼятьох звітах, і двоє не пишуть в один файл</span></div></foreignObject></g></g><g transform=\"translate(624.8671875, 2457.1953125)\" data-id=\"V1\" data-node=\"true\" id=\"flowchart-V1-110\" class=\"node default s flowchart-label\"><rect height=\"49\" width=\"398.00048828125\" y=\"-24.5\" x=\"-199.000244140625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-182.421875, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"383\" x=\"-9.078369140625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Агент внесення села<br />володіє сторінкою села, його подіями і його реєстром доказів</span></div></foreignObject></g></g><g transform=\"translate(1025.62109375, 2457.1953125)\" data-id=\"V2\" data-node=\"true\" id=\"flowchart-V2-111\" class=\"node default t flowchart-label\"><rect height=\"49\" width=\"384.00042724609375\" y=\"-24.5\" x=\"-192.00021362304688\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g transform=\"translate(-177.33203125, -17)\" style=\"\" class=\"label\"><rect/><foreignObject height=\"34\" width=\"369\" x=\"-7.168182373046875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Оркестратор централізовано: реєстр джерел, база записів,<br />журнал боргу, стрічка оновлень, довідник пасток</span></div></foreignObject></g></g><g transform=\"translate(624.8671875, 2540.1953125)\" data-id=\"V3\" data-node=\"true\" id=\"flowchart-V3-112\" class=\"node default t flowchart-label\"><rect height=\"49\" width=\"529.0006408691406\" y=\"-24.5\" x=\"-264.5003204345703\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"/><g t